[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moderators"
version = "0.1.0"
description = "Moderators: ModelHubMixin-based factory and core skeleton (Phase 1)."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Moderators Team" }]
dependencies = [
  "huggingface-hub>=0.22",
  "requests",
]

[project.urls]
Homepage = "https://github.com/viddexa/sahi"
Source = "https://github.com/viddexa/sahi"
"Bug Reports" = "https://github.com/viddexa/moderators/discussions/categories/q-a"
Changelog = "https://github.com/viddexa/moderators/releases"

[project.optional-dependencies]
transformers = ["transformers>=4.36"]
dev = [
  "pytest>=7.0",
  "pillow>=9.0",
  "ruff"
]

[project.scripts]
moderators = "moderators.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["moderators"]