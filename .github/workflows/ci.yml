name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: Lint and format checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra transformers

      - name: Run ruff linter
        uses: astral-sh/ruff-action@v2
        with:
          src: "."

      - name: Run ruff formatter check
        run: uv run ruff format --check .

      - name: Run docformatter check
        id: docformatter
        run: |
          uv run docformatter --check --recursive src/ tests/ 2>&1 | tee docformatter.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Post docformatter results as PR comment
        if: failure() && steps.docformatter.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('docformatter.log', 'utf8');
            if (output.trim()) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## Docformatter Issues\n\n```\n' + output + '\n```'
              });
            }

      - name: Fail if docformatter check failed
        if: steps.docformatter.outcome == 'failure'
        run: exit 1

  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra transformers

      - name: Run tests in parallel
        run: uv run pytest -n auto --junitxml=pytest-results.xml tests/

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: pytest-results.xml
          comment_mode: failures
          check_name: Test Results
