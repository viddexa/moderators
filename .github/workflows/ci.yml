name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: Lint and format checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra transformers

      - name: Run ruff linter
        id: ruff
        run: |
          uv run ruff check . 2>&1 | tee ruff.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Post ruff results as PR comment
        if: always() && steps.ruff.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('ruff.log', 'utf8');
            if (output.trim()) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## Ruff Linting Issues\n\n```\n' + output + '\n```'
              });
            }

      - name: Run ruff formatter check
        id: ruff-format
        run: |
          uv run ruff format --check . 2>&1 | tee ruff-format.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Post ruff format results as PR comment
        if: always() && steps.ruff-format.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('ruff-format.log', 'utf8');
            if (output.trim()) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## Ruff Formatting Issues\n\n```\n' + output + '\n```'
              });
            }

      - name: Run docformatter check
        id: docformatter
        run: |
          uv run docformatter --check --recursive src/ tests/ 2>&1 | tee docformatter.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Post docformatter results as PR comment
        if: failure() && steps.docformatter.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('docformatter.log', 'utf8');
            if (output.trim()) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## Docformatter Issues\n\n```\n' + output + '\n```'
              });
            }

      - name: Fail if any linting check failed
        if: |
          steps.ruff.outcome == 'failure' ||
          steps.ruff-format.outcome == 'failure' ||
          steps.docformatter.outcome == 'failure'
        run: exit 1

  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra transformers

      - name: Run tests in parallel
        run: uv run pytest -n auto --junitxml=pytest-results.xml tests/

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: pytest-results.xml
          comment_mode: failures
          check_name: Test Results
