name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: Lint and format checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra transformers

      - name: Run all linting checks in parallel
        id: lint-checks
        run: |
          # Run all linters in parallel and capture their outputs
          (uv run ruff check . 2>&1 | tee ruff.log; echo $? > ruff.exit) &
          (uv run ruff format --check . 2>&1 | tee ruff-format.log; echo $? > ruff-format.exit) &
          (uv run docformatter --check --recursive src/ tests/ 2>&1 | tee docformatter.log; echo $? > docformatter.exit) &

          # Wait for all background jobs to complete
          wait

          # Check if any linter failed
          RUFF_EXIT=$(cat ruff.exit)
          RUFF_FORMAT_EXIT=$(cat ruff-format.exit)
          DOCFORMATTER_EXIT=$(cat docformatter.exit)

          # Store results for later steps
          echo "ruff_failed=$RUFF_EXIT" >> $GITHUB_OUTPUT
          echo "ruff_format_failed=$RUFF_FORMAT_EXIT" >> $GITHUB_OUTPUT
          echo "docformatter_failed=$DOCFORMATTER_EXIT" >> $GITHUB_OUTPUT

          # Exit with failure if any check failed, but continue to post comments
          if [ "$RUFF_EXIT" -ne 0 ] || [ "$RUFF_FORMAT_EXIT" -ne 0 ] || [ "$DOCFORMATTER_EXIT" -ne 0 ]; then
            exit 1
          fi
        continue-on-error: true

      - name: Post ruff results as PR comment
        if: always() && steps.lint-checks.outputs.ruff_failed != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('ruff.log', 'utf8');
            if (output.trim()) {
              const body = '## ❌ Ruff Linting Issues\n\n' +
                'The following linting issues were found:\n\n' +
                '```\n' + output + '\n```\n\n' +
                '### 🔧 How to fix:\n\n' +
                '**Option 1: Auto-fix (recommended)**\n' +
                '```bash\n' +
                'uv run ruff check . --fix\n' +
                '```\n\n' +
                '**Option 2: Check only**\n' +
                '```bash\n' +
                'uv run ruff check .\n' +
                '```\n\n' +
                '💡 Most issues marked with `[*]` can be auto-fixed with the `--fix` flag.';

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Post ruff format results as PR comment
        if: always() && steps.lint-checks.outputs.ruff_format_failed != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('ruff-format.log', 'utf8');
            if (output.trim()) {
              const body = '## ❌ Ruff Formatting Issues\n\n' +
                'The following formatting issues were found:\n\n' +
                '```\n' + output + '\n```\n\n' +
                '### 🔧 How to fix:\n\n' +
                '**Auto-format your code:**\n' +
                '```bash\n' +
                'uv run ruff format .\n' +
                '```\n\n' +
                'This will automatically format all Python files to match the project style.';

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Post docformatter results as PR comment
        if: always() && steps.lint-checks.outputs.docformatter_failed != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('docformatter.log', 'utf8');
            if (output.trim()) {
              const body = '## ❌ Docformatter Issues\n\n' +
                'The following docstring formatting issues were found:\n\n' +
                '```\n' + output + '\n```\n\n' +
                '### 🔧 How to fix:\n\n' +
                '**Auto-format docstrings:**\n' +
                '```bash\n' +
                'uv run docformatter --in-place --recursive src/ tests/\n' +
                '```\n\n' +
                'This will automatically format all docstrings to follow PEP 257 conventions.';

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Fail if any linting check failed
        if: |
          always() && (
            steps.lint-checks.outputs.ruff_failed != '0' ||
            steps.lint-checks.outputs.ruff_format_failed != '0' ||
            steps.lint-checks.outputs.docformatter_failed != '0'
          )
        run: exit 1

  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra transformers

      - name: Run tests in parallel
        run: uv run pytest -n auto --junitxml=pytest-results.xml tests/

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: pytest-results.xml
          comment_mode: failures
          check_name: Test Results
